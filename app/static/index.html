<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImposterApply</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="mast">
      <p class="mark">ImposterApply</p>
      <h1>A resume for the role, not a new biography.</h1>
      <p class="lede">Start with your resume, map GitHub projects, match a job, edit the draft, then preview and download.</p>
    </header>
    <ol class="steps" id="steps" aria-label="Progress">
      <li data-step="1">Resume</li>
      <li data-step="2">GitHub</li>
      <li data-step="3">Role</li>
      <li data-step="4">Draft</li>
      <li data-step="5">Preview</li>
    </ol>
    <div id="banner" class="banner" hidden></div>
    <main id="main"></main>
  </div>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
