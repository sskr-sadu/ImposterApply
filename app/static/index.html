<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImposterApply</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="mast">
      <p class="mark">ImposterApply</p>
      <h1>A resume for the role, not a new biography.</h1>
      <p class="lede">Upload a resume PDF, paste the job, and choose which GitHub repositories may be read. The draft only rearranges facts you confirm.</p>
    </header>
    <ol class="steps" id="steps" aria-label="Progress">
      <li data-step="1">Role</li>
      <li data-step="2">Facts</li>
      <li data-step="3">GitHub</li>
      <li data-step="4">Projects</li>
      <li data-step="5">Draft</li>
    </ol>
    <div id="banner" class="banner" hidden></div>
    <main id="main"></main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
